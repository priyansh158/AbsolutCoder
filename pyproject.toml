[project]
name = "absolutcoder"
version = "0.1.0"
description = "Local terminal coding agent on Deep Agents and LangGraph, for any model provider"
requires-python = ">=3.12"
dependencies = [
    "deepagents",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]
anthropic = ["langchain-anthropic"]
google = ["langchain-google-genai"]
ollama = ["langchain-ollama"]
all = ["langchain-anthropic", "langchain-google-genai", "langchain-ollama"]

[project.scripts]
absolut = "absolutcoder.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
